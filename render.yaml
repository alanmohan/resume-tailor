# Render Blueprint: one Python web service (API) and one static site (frontend).
# No secret values live in this file. Entries marked "sync: false" are entered
# in the Render dashboard and are never stored in the repository.
#
# Order of setup:
#   1. Create the API service and set MONGODB_URI (Atlas) and OPENAI_API_KEY.
#      The API refuses to start in production without MONGODB_URI.
#   2. Create the static site with VITE_API_BASE_URL = the API's https URL.
#   3. Set the API's CORS_ORIGINS to the static site's exact https origin and
#      redeploy. The API refuses to start in production without CORS_ORIGINS.
#
# Free-plan notes: the API sleeps after about 15 minutes without traffic and
# takes roughly a minute to wake; nothing is persisted on its local disk, all
# data lives in MongoDB Atlas.

services:
  - type: web
    name: resume-tailor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # The Python patch version the test suite was run with.
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: APP_ENV
        value: production
      # Secrets: set in the dashboard.
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Exact origin of the static site, e.g. https://<static-site-name>.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # Random value generated by Render; keys the hashing of client IPs.
      - key: IP_HASH_SALT
        generateValue: true
      # Render's proxy terminates the connection, so the client IP for the
      # session rate limit is read from a header. Render sits behind
      # Cloudflare, which sets CF-Connecting-IP itself; the leftmost
      # X-Forwarded-For entry is whatever the client sent and is never used.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Non-secret settings.
      - key: MONGODB_DATABASE
        value: resume_tailor
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_EMBEDDING_DIMENSIONS
        value: "1536"
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: RETRIEVAL_MODE
        value: python
      - key: SESSION_TTL_HOURS
        value: "24"
      # Half the built-in default: extraction time grows with the length of
      # the profile text and has to fit into PROVIDER_TIMEOUT_SECONDS.
      - key: MAX_PROFILE_CHARS
        value: "30000"
      - key: MAX_JOB_CHARS
        value: "25000"
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "180"
      - key: PROVIDER_MAX_RETRIES
        value: "1"
      - key: SESSION_CREATE_LIMIT_PER_HOUR
        value: "20"
      - key: GLOBAL_DAILY_AI_CALL_LIMIT
        value: "600"

  - type: web
    name: resume-tailor-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Single-page app: every path serves index.html so deep links survive a refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public build-time value: the API's https URL, e.g.
      # https://resume-tailor-api.onrender.com . Changing it requires a rebuild.
      - key: VITE_API_BASE_URL
        sync: false
